# The settings of the Prose lint job of .github/workflows/docs.yaml. Most documents are in Indonesian, so the English spelling and
# style rules stay off. Only repeated words and the project rules in .github/vale/styles are checked.
StylesPath = .github/vale/styles
MinAlertLevel = error

[*.md]
BasedOnStyles = Vale, kibooz
Vale.Spelling = NO
Vale.Terms = NO
