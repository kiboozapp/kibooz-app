# The settings of the zizmor audit of the workflows, run by .github/workflows/workflow-lint.yaml.
# The job is a required check of the main ruleset.
rules:
  unpinned-uses:
    config:
      policies:
        # Every action, including the ones of GitHub itself, is pinned to a full commit SHA with the version in a comment
        "*": hash-pin
  # dependency-submit.yaml uses workflow_run so that no build script of a pull request ever runs with the write token that the
  # submission needs. It checks out nothing, as the dependency submission guide of Gradle describes.
  dangerous-triggers:
    ignore:
      - dependency-submit.yaml
