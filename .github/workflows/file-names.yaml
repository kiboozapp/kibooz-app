name: File names

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: file-names-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

# This check reports only. It is not a required check and a red run does not block a merge. It needs no secret, so it also
# runs on pull requests from forks.
jobs:
  file-names:
    name: File names
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ls-lint reads the names of the files and never opens one. The rules are in .ls-lint.yml.
      - name: Check the names of the files
        env:
          # renovate: datasource=npm depName=@ls-lint/ls-lint
          LS_LINT_VERSION: 2.3.2
        run: npx --yes "@ls-lint/ls-lint@${LS_LINT_VERSION}"
