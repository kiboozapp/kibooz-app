name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The private key of the release GitHub App is a secret of the release environment, which only main can use, so a workflow on
    # another branch cannot read it
    environment: release
    # The token comes from the App, so the job needs nothing from the default GITHUB_TOKEN
    permissions: {}
    steps:
      # A pull request that the default GITHUB_TOKEN creates starts no other workflow, and the required checks would never report.
      # The App is also the only actor that the tag ruleset lets create a version tag.
      - name: Create a token for the release app
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
