name: Release build

# Builds the unsigned release APK. Pull requests run it to find a broken release build early, and release-please.yaml calls it
# for a new release. It has no secret, so the build scripts and their dependencies never see the signing key.
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: The tag to build
        required: true
        type: string

concurrency:
  group: release-build-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  release-build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # No cache, so that nothing from an earlier run ends up in a released file
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # The scanners open with the stand-in models, which a release build closes without this property. See
      # docs/MODEL_PLACEHOLDERS.md and drop the property when real models replace them.
      - name: Release build
        run: sh ./gradlew assembleRelease --no-build-cache -Pkibooz.allowPlaceholderModels=true --stacktrace

      - name: Upload the unsigned release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kibooz-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
