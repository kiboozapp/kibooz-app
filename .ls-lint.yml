# The naming of the files of the repository, checked by the File names job of .github/workflows/file-names.yaml.
# A file has no extension rule of its own when it has none at all, such as gradlew and CODEOWNERS.
ls:
  # a folder is lowercase words joined by hyphens or underscores, and a leading dot marks the folder of a tool
  .dir: regex:\.?[a-z0-9]+([-_][a-z0-9]+)*

  # every other file is lowercase words joined by hyphens, with dots for a variant such as gradle-wrapper.properties
  .*: kebab-case

  # a Kotlin file is one name in PascalCase, the name of the main class in it
  .kt: PascalCase

  # the community files and the documents in capitals such as README.md and CODE_OF_CONDUCT.md are allowed next to kebab case
  .md: kebab-case | SCREAMING_SNAKE_CASE

  # AndroidManifest.xml is the name that Android requires, and every other XML file is snake case
  .xml: snake_case | regex:AndroidManifest

  # a resource name must be lowercase words joined by underscores, which Android enforces for the resource folders
  app/src/main/res:
    .xml: snake_case
    .png: snake_case
    .webp: snake_case
    .ttf: snake_case

  # the files of the models and their labels are snake case with the version in the name
  app/src/main/assets:
    .json: snake_case
    .tflite: snake_case
    .txt: snake_case

ignore:
  - .git
  - .gradle
  - .kotlin
  - .idea
  - build
  # GitHub names the issue forms by what the person sees
  - .github/ISSUE_TEMPLATE
  # the license files are named after the model and its license, such as emotion-nxp-deepface-MIT.txt
  - app/src/main/assets/licenses
