# Coverage comes from the unit tests of the Android CI workflow, see https://docs.codecov.com/docs/codecov-yaml
coverage:
  status:
    # Both statuses only report. They do not fail a pull request until the team decides to require them.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, files"
  # stay quiet on pull requests that do not change coverage, such as documentation changes
  require_changes: true
